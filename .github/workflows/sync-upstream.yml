name: Sync Upstream

# Keeps this fork up to date with WhiteDNS/WhiteDNS-Android.
# Runs daily at 06:00 UTC and via the manual "Run workflow" button.
# When upstream has new commits, it merges them into main and then triggers
# the signed APK build. The force_build input builds even when unchanged.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Also build APKs when upstream has no new commits"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        id: sync
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/WhiteDNS/WhiteDNS-Android.git
          git fetch upstream main

          NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits not yet in this fork: ${NEW_COMMITS}"

          if [ "${NEW_COMMITS}" -gt 0 ]; then
            git merge upstream/main --no-edit
            git push origin main
            echo "Fork updated with ${NEW_COMMITS} upstream commit(s)."
          else
            echo "Fork is already up to date with upstream."
          fi

          if [ "${NEW_COMMITS}" -gt 0 ] || [ "${FORCE_BUILD}" = "true" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build signed APKs
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    permissions:
      contents: write
